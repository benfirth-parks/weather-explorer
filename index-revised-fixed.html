2) REPLACE `fetchFTS360Station` with the following. This normalizes either an API
response that is already normalized or a raw FTS CSV/row response, so the UI is no

function normalizeFTSResponse(payload){
  if(typeof payload==='string') return parseFTSCsv(payload).map(ftsRowToRecord).filter(Boolean);
  if(Array.isArray(payload)){
    return payload.map(row=>{
      if(!row || typeof row!=='object') return null;
      return row.measurementDateTime ? row : ftsRowToRecord(row);
    }).filter(Boolean);
  }
  const rows=payload?.data || payload?.rows || payload?.observations || payload?.records;
  if(Array.isArray(rows)) return normalizeFTSResponse(rows);
  return [];
}
async function fetchFTS360Station(id, hrs){
  const url=`/api/fts?station=${encodeURIComponent(id)}&hours=${hrs}`;
  const res=await fetch(url,{headers:{Accept:'application/json, text/csv;q=0.9'}});
  if(!res.ok) throw new Error('Proxy error: '+res.status);
  const contentType=res.headers.get('content-type')||'';
  const payload=contentType.includes('json') ? await res.json() : await res.text();
  return sanitizeRecords(normalizeFTSResponse(payload));
}
