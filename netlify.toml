[build]
  publish = "."
  functions = "netlify/functions"

# Ben approved 2026-11-02: the NOAA LRGS username is a short word that also
# appears in ordinary page text and trips Netlify's secret scan. The username
# is not sensitive; LRGS_PASSWORD is still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "LRGS_USER"

[[redirects]]
  from = "/api/fts"
  to = "/.netlify/functions/fts"
  status = 200

[[redirects]]
  from = "/api/fts-inspect"
  to = "/.netlify/functions/fts-inspect"
  status = 200

[[redirects]]
  from = "/api/fts-backfill"
  to = "/.netlify/functions/fts-backfill"
  status = 200

[[redirects]]
  from = "/api/fts-sync-manual"
  to = "/.netlify/functions/fts-sync-manual"
  status = 200

[[redirects]]
  from = "/api/plot-profile"
  to = "/.netlify/functions/plot-profile"
  status = 200

[[redirects]]
  from = "/api/cleanouts"
  to = "/.netlify/functions/cleanouts"
  status = 200

[[redirects]]
  from = "/api/ai-summary"
  to = "/.netlify/functions/ai-summary"
  status = 200

[[redirects]]
  from = "/api/site-health"
  to = "/.netlify/functions/site-health"
  status = 200

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

# Runs at 15 minutes past every hour, in UTC.
[functions."fts-sync"]
  schedule = "15 * * * *"

# Site health check: 45 minutes past every hour, in UTC.
[functions."site-health-check"]
  schedule = "45 * * * *"
