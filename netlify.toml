[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/fts"
  to = "/.netlify/functions/fts"
  status = 200

[[redirects]]
  from = "/api/fts-inspect"
  to = "/.netlify/functions/fts-inspect"
  status = 200

# Runs at 15 minutes past every hour, in UTC.
[functions."fts-sync"]
  schedule = "15 * * * *"
