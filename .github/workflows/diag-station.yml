# Read-only station freshness diagnosis (archive-audit branch only).
name: Station diagnosis (read-only)
on:
  push:
    branches: [archive-audit]
    paths: ["scripts/diag_station.mjs", ".github/workflows/diag-station.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - env:
          ADMIN_TOKEN: ${{ secrets.ARCHIVE_ADMIN_TOKEN }}
        run: node scripts/diag_station.mjs
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add audit
          git commit -m "Station diagnosis [skip netlify] [skip ci]" || true
          git push
