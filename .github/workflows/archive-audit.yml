# One-shot, read-only archive dump. Runs only on pushes to the
# `archive-audit` branch and commits the dump back to that branch.
name: Archive audit (read-only)
on:
  push:
    branches: [archive-audit]
    paths: [".github/workflows/archive-audit.yml", "scripts/archive_audit.mjs"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/archive_audit.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add audit
          git commit -m "Archive audit dump [skip netlify] [skip ci]"
          git push
