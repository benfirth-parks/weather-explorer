# Temporary diagnostics: wait for the live site to serve the NOAA build.
name: diag live check
on:
  push:
    branches: [diag/waterton]
    paths-ignore: ["diag-data/**"]
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          for i in $(seq 1 40); do
            n=$(curl -sS https://rockiesweatherdataexplorer.netlify.app/assets/feed-status.js | grep -c NOAA || true)
            if [ "$n" != "0" ]; then echo "LIVE deployed after $i checks $(date -u +%H:%M:%SZ)"; exit 0; fi
            sleep 10
          done
          echo "LIVE still old build $(date -u +%H:%M:%SZ)"
