# Temporary diagnostics: check what the live site is serving.
name: diag live check
on:
  push:
    branches: [diag/waterton]
    paths-ignore: ["diag-data/**"]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://rockiesweatherdataexplorer.netlify.app/assets/feed-status.js | grep -c "NOAA" | sed 's/^/LIVE noaa-mentions /'
          curl -sS "https://rockiesweatherdataexplorer.netlify.app/api/fts?station=fts-waterton&hours=6" | head -c 300 | sed 's/^/LIVE waterton /'
