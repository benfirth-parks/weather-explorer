name: diag verify
on:
  push:
    branches: [diag/waterton]
    paths-ignore: ["diag-data/**"]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in fts-bowprecip fts-vermillion fts-sunshine fts-waterton fts-boslo; do
            curl -sS "https://rockiesweatherdataexplorer.netlify.app/api/fts?station=$s&hours=41" -o r.json
            python3 -c "
          import json; d=json.load(open('r.json')); d=d if isinstance(d,list) else d.get('observations',[])
          from collections import Counter
          src=Counter(o.get('source','fts') for o in d)
          pt=[o for o in d if 'precipTotal' in o and '2026-11-02T00' <= o['measurementDateTime'] < '2026-11-02T14']
          print('V','$s',len(d),dict(src),'precipTotal Nov2 00-14Z:',len(pt), (pt[0]['precipTotal'],pt[-1]['precipTotal']) if pt else '', 'last', d[-1]['measurementDateTime'] if d else '')
          "
          done
