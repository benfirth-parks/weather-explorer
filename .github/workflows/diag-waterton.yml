# Temporary diagnostics branch workflow.
name: diag waterton
on:
  push:
    branches: [diag/waterton]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in fts-boslo fts-simplo fts-vulture fts-sunshine fts-skoki fts-maligne; do
            curl -sS -m 60 "https://rockiesweatherdataexplorer.netlify.app/api/fts?station=$s&hours=24" -o r.json
            python3 -c "
          import json,sys
          d=json.load(open('r.json'))
          obs=d.get('observations') or d.get('data') or []
          last=obs[-1] if obs else {}
          srcs={}
          for o in obs: srcs[o.get('source','fts')]=srcs.get(o.get('source','fts'),0)+1
          print('FTS','$s','n=',len(obs),'last=',last.get('measurementDateTime'),'src=',last.get('source','fts'),srcs,'lastSynced=',d.get('lastSyncedAt'))
          " || head -c 300 r.json
          done
