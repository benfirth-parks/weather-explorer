# One-shot gap fill (run 3: single-station FTS historical reports for Bow Summit, Simpson Lower/Upper, Sunshine).
# posts fill/*.json.gz with mode=fill-fields, then re-dumps the archive
# so the result can be verified, and commits both back to this branch.
name: Archive gap fill (one-shot)
on:
  push:
    branches: [archive-fill]
    paths: [".github/workflows/archive-fill.yml", "scripts/archive_fill.mjs"]
permissions:
  contents: write
concurrency: { group: archive-fill, cancel-in-progress: false }
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Fill
        env:
          ADMIN_TOKEN: ${{ secrets.ARCHIVE_ADMIN_TOKEN }}
        run: node scripts/archive_fill.mjs
      - name: Re-audit (after reads settle)
        if: always()
        run: sleep 120 && node scripts/archive_audit.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add audit
          git commit -m "Archive fill results [skip netlify] [skip ci]" || true
          git push
