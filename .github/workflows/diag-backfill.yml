name: diag backfill U Sask
on:
  push:
    branches: [diag/usask-radiation]
    paths: [".github/workflows/diag-backfill.yml"]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          # run 5: dump live API data
          mkdir -p diag-out/api; cd diag-out/api
          for s in fts-boslo fts-bosup fts-bowsummit fts-bowprecip fts-lookout fts-simplo fts-simpup fts-stanley fts-sunshine fts-vulture fts-whymper fts-boulder fts-pikarun fts-vermillion fts-lakelouise fts-castle fts-skoki us-helen us-peyto fts-tangleridge fts-coleman fts-bigbend fts-maligne fts-saskcrossing fts-jasperqd1 fts-dorothy fts-devona fts-rangercreek fts-summitlake fts-akamina fts-waterton kc-aster kc-burstall kc-highwood kc-mudlake kc-rundle; do
            curl -sS -m 60 -o $s.json "https://rockiesweatherdataexplorer.netlify.app/api/fts?station=$s&hours=168" || echo "fail $s"
          done
          cd ../.. && git config user.name diag && git config user.email diag@users.noreply.github.com && git add diag-out/api && git commit -qm 'diag: live API dump' && git push
