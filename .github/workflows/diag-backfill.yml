name: diag backfill U Sask
on:
  push:
    branches: [diag/usask-radiation]
    paths: [".github/workflows/diag-backfill.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          # run 3: read what the site serves
          for s in us-peyto us-helen; do
            curl -sS -m 60 -D - -o body.json "https://rockiesweatherdataexplorer.netlify.app/api/fts?station=$s&hours=24" | head -20
            head -c 300 body.json; echo
            jq -c '[length, (.[-1]), ([.[]|select(.swIn!=null)]|length)]' body.json || true
          done
