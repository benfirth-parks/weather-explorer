# One-shot archive data-quality cleanup. Runs only on pushes to the
# `archive-fill` branch that touch qc/ patches; re-dumps the archive after.
name: Archive QC cleanup (one-shot)
on:
  push:
    branches: [archive-fill]
    paths: ["qc/**", "scripts/archive_qc.mjs"]
permissions:
  contents: write
concurrency: { group: archive-fill, cancel-in-progress: false }
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Apply QC patches
        env:
          ADMIN_TOKEN: ${{ secrets.ARCHIVE_ADMIN_TOKEN }}
        run: node scripts/archive_qc.mjs
      - name: Re-audit (after reads settle)
        if: always()
        run: sleep 120 && node scripts/archive_audit.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add audit
          git commit -m "Archive QC results [skip netlify] [skip ci]" || true
          git push
