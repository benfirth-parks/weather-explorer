# NOAA LRGS ingestion for Canadian Rockies FTS stations.
#
# Connects to NOAA/Wallops LRGS server every 15 minutes, pulls raw GOES-DCP
# transmissions for the Parks Canada / Avalanche Canada FTS stations and keeps
# them as a workflow artifact (lrgs-<run id>). Nothing is committed to main, so
# the live site is not rebuilt every 15 minutes. While the decoding is being
# worked out against FTS360, the site does not read this data.
#
# Run it by hand with a longer "since" (e.g. "now - 14 days") to pull history.
#
# Setup:
#   1. Register with NOAA/Wallops DCS operator:  (757) 824-7450
#      Provide: name, email, org (Parks Canada Visitor Safety),
#      phone, 6-char preferred username.
#      Accounts propagate to all 4 public LRGS servers within 24h.
#   2. Add repo secrets under Settings -> Secrets and variables -> Actions:
#        LRGS_USER      NOAA-issued username
#        LRGS_PASSWORD  NOAA-issued password
#   3. (Optional) Override server via repo variable LRGS_SERVER; default is
#      cdadata.wcda.noaa.gov. The script falls back to the others in turn:
#        cdabackup.wcda.noaa.gov
#        lrgseddn1.cr.usgs.gov
#        lrgseddn2.cr.usgs.gov
#
# The workflow is a no-op (exit 0 with a notice) until the secrets are
# present, so it's safe to merge before the NOAA account is issued.

name: NOAA LRGS ingest

# The live feed now runs in the Netlify station sync (netlify/functions/_lrgs.mjs).
# This workflow is kept for manual history pulls only.
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'How far back to fetch, e.g. "now - 14 days"'
        required: false
        default: "now - 30 minutes"

concurrency:
  group: lrgs-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip if LRGS credentials not set
        id: check
        env:
          LRGS_USER: ${{ secrets.LRGS_USER }}
        run: |
          if [ -z "${LRGS_USER:-}" ]; then
            echo "::notice::LRGS_USER secret is not set — skipping. Add it after registering with NOAA/Wallops (757) 824-7450."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ingestion
        if: steps.check.outputs.run == 'true'
        env:
          LRGS_USER: ${{ secrets.LRGS_USER }}
          LRGS_PASSWORD: ${{ secrets.LRGS_PASSWORD }}
          LRGS_SERVER: ${{ vars.LRGS_SERVER || 'cdadata.wcda.noaa.gov' }}
          LRGS_SINCE: ${{ inputs.since || 'now - 30 minutes' }}
          LRGS_MAX_SECONDS: "1200"
          LRGS_OUT: lrgs-out
        run: |
          set -euo pipefail
          python scripts/lrgs_ingest.py

      - name: Keep messages as an artifact
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lrgs-${{ github.run_id }}
          path: lrgs-out
          retention-days: 30
